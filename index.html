<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <pre id="result" aria-live="polite"></pre>
  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const submit = form.querySelector("button");
    const result = document.querySelector("#result");
    const inputPrompt = "Введите текст заявки.";
    const errorMessage = "Не удалось разобрать заявку. Попробуйте ещё раз.";
    const topicLabels = { delivery: "Доставка", pricing: "Стоимость", other: "Другое" };
    let renderId = 0;

    // Сообщение ставится в следующем кадре после очистки,
    // чтобы aria-live объявил и повторный одинаковый текст.
    function show(text) {
      const id = ++renderId;
      result.textContent = "";
      requestAnimationFrame(() => {
        if (id === renderId) result.textContent = text;
      });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (submit.disabled) return;

      const text = message.value;
      if (!text.trim()) {
        show(inputPrompt);
        message.focus();
        return;
      }

      submit.disabled = true;
      result.setAttribute("aria-busy", "true");
      show("Разбираем заявку…");
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
          signal: AbortSignal.timeout(5_000),
        });
        const data = await reply.json();

        if (reply.status === 400 && data?.status === "invalid_input") {
          show(inputPrompt);
        } else if (reply.status === 413) {
          show("Текст заявки слишком длинный. Сократите его и попробуйте ещё раз.");
        } else if (reply.status === 200 && data?.status === "manual_review") {
          show("Разберите заявку вручную");
        } else if (reply.status === 200 && data?.status === "ready") {
          const topic = topicLabels[data.topic] ?? data.topic;
          show(`Тема: ${topic}\nЧерновик:\n${data.draft}`);
        } else {
          show(errorMessage);
        }
      } catch {
        show(errorMessage);
      } finally {
        result.removeAttribute("aria-busy");
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
